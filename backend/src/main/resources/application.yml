server:
  port: 8080

spring:
  application:
    name: plogging-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/plogging_db
    username: plogging_user
    password: plogging_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
