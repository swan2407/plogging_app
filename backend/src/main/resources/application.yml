server:
  port: 8080

spring:
  application:
    name: plogging-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/plogging_db
    username: plogging_user
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET:dev-plogging-jwt-secret-change-this-value-before-production-2026}
  access-token-validity-seconds: 3600
  refresh-token-validity-seconds: 1209600

app:
  upload:
    dir: uploads
    public-url-prefix: /uploads

public-data:
  household-waste:
    base-url: https://apis.data.go.kr/1741000/household_waste_info
    service-key: ${PUBLIC_DATA_SERVICE_KEY:}
